name: Build HIZMOS v9.0

on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v1

      - name: Install ESP32 core
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@2.0.17

      - name: Install libraries
        run: |
          arduino-cli lib install "RadioLib@6.5.0"

      - name: Compile
        run: |
          arduino-cli compile --fqbn "esp32:esp32:esp32:PartitionScheme=min_spiffs" --build-path build MySketch

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: hizmos-firmware
          path: build/MySketch.ino.bin
